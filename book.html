<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book a Meeting Spot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #000;
      color: white;
    }
    header {
      background-color: #000;
      color: white;
      padding: 1em;
      text-align: center;
    }
    nav {
      background-color: #000;
      display: flex;
      justify-content: center;
      padding: 0.5em 0;
    }
    nav a {
      color: white;
      margin: 0 1em;
      text-decoration: none;
    }
    nav a:hover {
      text-decoration: underline;
    }
    section {
      padding: 2em;
      max-width: 600px;
      margin: 0 auto;
    }
    h2 {
      text-align: center;
    }
    form {
      background-color: #111;
      padding: 2em;
      border-radius: 8px;
    }
    label {
      display: block;
      margin-top: 1em;
      font-weight: bold;
    }
    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 0.5em;
      margin-top: 0.5em;
      border-radius: 4px;
      border: 1px solid #ccc;
      background-color: #222;
      color: white;
    }
    button {
      margin-top: 1.5em;
      padding: 0.7em 1.5em;
      background-color: red;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: darkred;
    }
    footer {
      background-color: #000;
      color: white;
      text-align: center;
      padding: 1em;
      margin-top: 3em;
    }
  </style>
</head>
<body>

  <header>
    <h1>Eisenhower Malow Political Society</h1>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="join.html">Join</a>
    <a href="book.html">Book</a>
    <a href="contact.html">Contact</a>
  </nav>

  <section>
    <h2>Book a Spot</h2>
    <form action="https://formspree.io/f/xwpovgne" method="POST">
      <label for="firstName">First Name</label>
      <input type="text" id="firstName" name="firstName" required />

      <label for="lastName">Last Name</label>
      <input type="text" id="lastName" name="lastName" required />

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required />

      <button type="submit">Book Now</button>
    </form>
  </section>

  <footer>
    <p>&copy; 2025 Eisenhower Malow Political Society. All rights reserved.</p>
  </footer>

</body>
</html>
