<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Join Political Society</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #003366;
      color: white;
      padding: 1em;
      text-align: center;
    }
    nav {
      background-color: #0055a5;
      display: flex;
      justify-content: center;
      padding: 0.5em 0;
    }
    nav a {
      color: white;
      margin: 0 1em;
      text-decoration: none;
    }
    nav a:hover {
      text-decoration: underline;
    }
    form {
      background-color: #e9ecef;
      padding: 2em;
      max-width: 600px;
      margin: 2em auto;
      border-radius: 8px;
    }
    form h3 {
      margin-top: 0;
      color: #003366;
    }
    label {
      display: block;
      margin-top: 1em;
      font-weight: bold;
    }
    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 0.5em;
      margin-top: 0.5em;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 1.5em;
      padding: 0.7em 1.5em;
      background-color: #0055a5;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #004080;
    }
    footer {
      background-color: #003366;
      color: white;
      text-align: center;
      padding: 1em;
    }
  </style>
</head>
<body>

  <header>
    <h1>Join the Political Society</h1>
    <p>Become a member and make a difference.</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="join.html">Join</a>
    <a href="events.html">Events</a>
    <a href="contact.html">Contact</a>
  </nav>

  <form action="https://formspree.io/f/xwpovgne" method="POST" id="joinForm">
    <h3>Join Political Society</h3>
    <label for="firstName">First Name</label>
    <input type="text" id="firstName" name="firstName" required />

    <label for="lastName">Last Name</label>
    <input type="text" id="lastName" name="lastName" required />

    <label for="school">School</label>
    <input type="text" id="school" name="school" required />

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" required />

    <button type="submit">Join Now</button>
  </form>

  <footer>
    <p>&copy; 2025 Political Society. All rights reserved.</p>
  </footer>

</body>
</html>
